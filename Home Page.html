<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #000;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 4em;
      margin: 0;
    }

    p {
      font-size: 1.5em;
      margin: 10px 0 40px 0;
      color: #ccc;
    }

    .trending-btn {
      position: relative;
      display: inline-block;
      padding: 20px 40px;
      font-size: 1.2em;
      color: white;
      background-color: rgba(0, 0, 0, 0.7);
      border: 2px solid white;
      border-radius: 8px;
      text-decoration: none;
      overflow: hidden;
      z-index: 1;
      transition: background-color 0.3s ease;
    }

    .trending-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('images/trend-collage.jpg') center/cover no-repeat;
      opacity: 0.2;
      z-index: -1;
      filter: grayscale(100%);
    }

    .trending-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .search-bar {
      position: absolute;
      top: 20px;
      left: 20px;
    }

    .search-bar input[type="text"] {
      padding: 12px 18px;           /* Bigger padding */
      border-radius: 6px;
      border: none;
      font-size: 16px;              /* Larger text */
      background-color: #222;
      color: white;
      width: 250px;                 /* Wider box */
    }

    .search-bar input[type="text"]::placeholder {
      color: #888;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Search bar (not functional) -->
  <div class="search-bar">
    <input type="text" placeholder="Search...">
  </div>

  <h1>Encyclopedia</h1>
  <p>Free Online Encyclopedia</p>
  <a href="Trending Page.html" class="trending-btn">View Trending</a>

</body>
</html>
