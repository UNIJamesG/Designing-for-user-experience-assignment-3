<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trending</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      font-size: 3em;
      margin-bottom: 40px;
    }

    .trend-container {
      display: grid;                 
      grid-template-columns: repeat(2, 1fr); 
      gap: 20px;                     
      justify-items: center;         
      margin-bottom: 60px;
    }

    .trend {
      text-align: center;
    }

    .trend img {
      width: 250px;                  
      height: 250px;                 
      object-fit: cover;             
      border: 2px solid white;
      border-radius: 10px;
      transition: transform 0.3s ease;
      cursor: pointer;             
    }

    .trend img:hover {
      transform: scale(1.05);         
    }

    a {
      text-decoration: none;        
    }

    a.back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      font-size: 1em;
      color: #aaa;
      text-decoration: none;
    }

    a.back-link:hover {
      color: white;
    }
  </style>
</head>
<body>

  <h1>Trending Topics</h1>

  <div class="trend-container">
    
    <a href="newPage.html" class="trend">
      <img src="images/trend1.jpg" alt="Trend Image 1">
    </a>
   

    
    <a href="#" class="trend">
      <img src="images/trend2.jpg" alt="Trend Image 2">
    </a>
  

  
    <a href="#" class="trend">
      <img src="images/trend3.jpg" alt="Trend Image 3">
    </a>
   

   
    <a href="#" class="trend">
      <img src="images/trend4.jpg" alt="Trend Image 4">
    </a>
    
  </div>

  <a class="back-link" href="Home Page.html">← Back to Home</a>

</body>
</html>
