<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trending Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 30px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .image-button {
      position: relative;
      cursor: pointer;
      border: none;
      padding: 0;
      background: none;
      transition: transform 0.3s ease;
    }

    .image-button:hover {
      transform: scale(1.05); 
    }

    .image-button img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 2px solid white;
      display: block;
    }

    .image-label {
      position: absolute;
      bottom: 8px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 4px 8px;
      font-size: 0.9em;
      border-radius: 4px;
    }

    .back-link {
      display: inline-block;
      margin: 40px 0;
      padding: 12px 24px;
      font-size: 1em;
      background-color: #222;
      color: white;
      border: 2px solid white;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .back-link:hover {
      background-color: #444;
    }
  </style>
</head>
<body>

  <h1>Trending</h1>

  <div class="grid">
    <button class="image-button" onclick="location.href='michael-jordan.html'">
      <img src="images/trend1.jpg" alt="Trend 1">
      <span class="image-label">Michael Jordan</span>
    </button>

    <button class="image-button">
      <img src="images/trend2.jpg" alt="Trend 2">
      <span class="image-label">China</span>
    </button>

    <button class="image-button">
      <img src="images/trend3.jpg" alt="Trend 3">
      <span class="image-label">Nike</span>
    </button>

    <button class="image-button">
      <img src="images/trend4.jpg" alt="Trend 4">
      <span class="image-label">Napoleon</span>
    </button>
  </div>

  <a href="Home Page.html" class="back-link">← Back to Home Page</a>

</body>
</html>
